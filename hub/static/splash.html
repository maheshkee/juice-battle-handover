<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      width: 100%; height: 100%;
      background: #000;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }
    img {
      max-width: 60vw;
      max-height: 60vh;
      opacity: 0;
      animation: fadein 1s ease-in forwards;
    }
    @keyframes fadein {
      from { opacity: 0; }
      to   { opacity: 1; }
    }
  </style>
</head>
<body>
  <img src="/static/dharanova_logo.png" alt="">
  <script>
    setTimeout(function() {
      window.location.href = 'http://localhost:5000/v4';
    }, 3000);
  </script>
</body>
</html>
