# Juice Battle kiosk — log the 'arduino' user straight into the desktop with no
# password prompt, so the board comes up demo-ready after a power cycle.
# Installed to /etc/lightdm/lightdm.conf.d/ by setup.sh (LightDM reads this dir
# AFTER /etc/lightdm/lightdm.conf, so these keys win without editing the stock file).
# Mirrors what was hand-applied to AQ3's /etc/lightdm/lightdm.conf.
[Seat:*]
autologin-user=arduino
autologin-user-timeout=0
greeter-show-manual-login=false
